name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
        
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '16.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: |
        npm install -g nativescript
        npm install
        
    - name: Set up Android SDK
      uses: android-actions/setup-android@v2
        
    - name: Generate Keystore
      run: |
        keytool -genkeypair \
          -v \
          -keystore nutritional-calculator.keystore \
          -alias nutritional-calculator \
          -keyalg RSA \
          -keysize 2048 \
          -validity 10000 \
          -storepass nutritional-calculator \
          -keypass nutritional-calculator \
          -dname "CN=NutritionalCalculator,O=NutritionalCalculator,L=Unknown,C=US"
          
    - name: Build Android Release
      run: npm run build:android
        
    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: app-release
        path: platforms/android/app/build/outputs/apk/release/app-release.apk
        retention-days: 5
